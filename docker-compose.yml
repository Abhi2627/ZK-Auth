# ZK-Auth — Infrastructure Only
# Runs: PostgreSQL + TimescaleDB + Redis
# Backend, Web, and ML Service run natively via start.sh
#
# Usage: docker-compose up -d
# Stop:  docker-compose down
# Wipe:  docker-compose down -v  (deletes all data)

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zkauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     zkauth_root
      POSTGRES_PASSWORD: changeme_dev
      POSTGRES_DB:       zkauth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U zkauth_root -d zkauth_db"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ─── TimescaleDB (telemetry) ─────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: zkauth-timescale
    restart: unless-stopped
    environment:
      POSTGRES_USER:     zkauth_root
      POSTGRES_PASSWORD: changeme_dev
      POSTGRES_DB:       zkauth_telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U zkauth_root -d zkauth_telemetry"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zkauth-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass changeme_dev
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "changeme_dev", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10

volumes:
  postgres_data:
  timescale_data:
  redis_data:
