<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZK-Auth Browser Benchmark</title>
  <style>
    body { font-family: monospace; max-width: 820px; margin: 40px auto; padding: 0 20px; background: #0f0f0f; color: #e0e0e0; }
    h1   { color: #7dd3fc; border-bottom: 1px solid #333; padding-bottom: 8px; }
    h2   { color: #a5f3a0; margin-top: 28px; }
    .btn { background: #1d4ed8; color: #fff; border: none; padding: 10px 24px;
           font-size: 15px; font-family: monospace; cursor: pointer; border-radius: 4px; margin: 4px; }
    .btn:disabled { background: #374151; color: #6b7280; cursor: default; }
    .btn:hover:not(:disabled) { background: #2563eb; }
    #log { background: #111; border: 1px solid #333; padding: 14px; margin-top: 16px;
           height: 300px; overflow-y: auto; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
    #results { background: #111; border: 1px solid #22c55e; padding: 14px; margin-top: 16px;
               display: none; font-size: 13px; line-height: 1.8; }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }
    .dim { color: #6b7280; }
    .hi  { color: #7dd3fc; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th,td { text-align: right; padding: 4px 12px; border-bottom: 1px solid #222; }
    th    { color: #7dd3fc; }
    td:first-child, th:first-child { text-align: left; }
  </style>
</head>
<body>
<h1>ZK-Auth Browser Benchmark</h1>
<p class="dim">Measures real Groth16 proof generation time in <strong>this browser</strong>
using snarkjs + WebAssembly. Results → Table I of the paper.</p>

<div>
  <button class="btn" id="btnWarm" onclick="runBenchmark(5, true)">Warm-up (5 trials)</button>
  <button class="btn" id="btnRun"  onclick="runBenchmark(30, false)">Run benchmark (30 trials)</button>
  <button class="btn" id="btnCopy" onclick="copyResults()" style="display:none">Copy JSON results</button>
</div>
<div id="log">Ready. Make sure ./start.sh is running, then click Run benchmark.</div>
<div id="results"></div>

<script>
// ── snarkjs loaded inline via importScripts in the worker ──────────────────
const BN254_P = 21888242871839275222246405745257275088548364400416034343698204186575808495617n;

function hexToField(hex) {
  const v = BigInt('0x' + hex.replace(/^0x/, ''));
  return ((v % BN254_P) + BN254_P) % BN254_P;
}

function nowMs() { return performance.now(); }
function round(x) { return Math.round(x * 1000) / 1000; }

function stats(arr) {
  if (!arr.length) return { n:0, mean:null, median:null, stddev:null, min:null, max:null, p95:null, p99:null };
  const s = [...arr].sort((a,b) => a - b);
  const n = s.length;
  const mean = s.reduce((a,b) => a+b, 0) / n;
  const variance = s.reduce((a,b) => a+(b-mean)**2, 0) / n;
  const pct = p => s[Math.min(n-1, Math.floor(p/100*n))];
  return {
    n, mean: round(mean), median: round(pct(50)), stddev: round(Math.sqrt(variance)),
    min: round(s[0]), max: round(s[n-1]), p95: round(pct(95)), p99: round(pct(99))
  };
}

// ── Single-shot proof via a fresh worker per trial (avoids state issues) ───
function proveOnce(secretField, nonceField) {
  return new Promise((resolve, reject) => {
    const snarkjsUrl = window.location.origin + '/vendor/snarkjs.min.js';
    const wasmUrl    = window.location.origin + '/circuits/auth/auth.wasm';
    const zkeyUrl    = window.location.origin + '/circuits/auth/auth.zkey';

    const workerSrc = `
self.importScripts('${snarkjsUrl}');
self.onmessage = async function(ev) {
  const { secretField, nonceField, wasmUrl, zkeyUrl } = ev.data;
  const t0 = performance.now();
  try {
    const { proof, publicSignals } = await snarkjs.groth16.fullProve(
      { secret: secretField, nonce: nonceField },
      wasmUrl,
      zkeyUrl
    );
    const ms = performance.now() - t0;
    self.postMessage({ ok: true, proof, publicSignals, ms });
  } catch(err) {
    self.postMessage({ ok: false, error: String(err) });
  }
};
`;
    const blob = new Blob([workerSrc], { type: 'application/javascript' });
    const url  = URL.createObjectURL(blob);
    const w    = new Worker(url);

    const timer = setTimeout(() => {
      w.terminate();
      URL.revokeObjectURL(url);
      reject(new Error('Timeout (60s)'));
    }, 60000);

    w.onmessage = ev => {
      clearTimeout(timer);
      w.terminate();
      URL.revokeObjectURL(url);
      if (ev.data.ok) {
        resolve({ workerMs: round(ev.data.ms), proof: ev.data.proof });
      } else {
        reject(new Error(ev.data.error));
      }
    };

    w.onerror = err => {
      clearTimeout(timer);
      w.terminate();
      URL.revokeObjectURL(url);
      reject(new Error(err.message || 'Worker error'));
    };

    w.postMessage({ secretField, nonceField, wasmUrl, zkeyUrl });
  });
}

// ── Logging ─────────────────────────────────────────────────────────────────
const logEl = document.getElementById('log');
function log(msg, cls) {
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.textContent = ''; }

// ── Main ────────────────────────────────────────────────────────────────────
let lastJson = null;

async function runBenchmark(trials, warmup) {
  document.getElementById('btnWarm').disabled = true;
  document.getElementById('btnRun').disabled  = true;
  document.getElementById('btnCopy').style.display = 'none';
  clearLog();

  log(`ZK-Auth Browser Benchmark — ${warmup ? 'WARM-UP' : 'MAIN RUN'} (${trials} trials)`, 'hi');
  log(`Browser: ${navigator.userAgent.substring(0, 100)}`, 'dim');
  log('');

  // Pre-fetch artifacts into browser cache
  log('Prefetching circuit artifacts...', 'dim');
  const preT = nowMs();
  try {
    await Promise.all([
      fetch('/circuits/auth/auth.wasm', { cache: 'force-cache' }),
      fetch('/circuits/auth/auth.zkey',  { cache: 'force-cache' }),
    ]);
    log(`Artifacts cached in ${round(nowMs()-preT)}ms.`, 'ok');
  } catch(e) {
    log(`Prefetch failed: ${e.message} — will try anyway.`, 'err');
  }

  const secretHex = Array.from(crypto.getRandomValues(new Uint8Array(32)))
    .map(b => b.toString(16).padStart(2,'0')).join('');
  const secretField = hexToField(secretHex).toString();

  log('');
  log('trial | wallMs | workerMs | status');
  log('------+--------+----------+-------');

  const rows = [];

  for (let i = 0; i < trials; i++) {
    const nonceHex = Array.from(crypto.getRandomValues(new Uint8Array(32)))
      .map(b => b.toString(16).padStart(2,'0')).join('');
    const nonceField = hexToField(nonceHex).toString();

    const t0 = nowMs();
    try {
      const { workerMs } = await proveOnce(secretField, nonceField);
      const wallMs = round(nowMs() - t0);
      rows.push({ trial: i+1, wallMs, workerMs, status: 'ok' });
      log(`${String(i+1).padStart(5)} | ${String(wallMs).padStart(6)} | ${String(workerMs).padStart(8)} | ok`);
    } catch(e) {
      const wallMs = round(nowMs() - t0);
      rows.push({ trial: i+1, wallMs, workerMs: null, status: `err: ${e.message.substring(0,60)}` });
      log(`${String(i+1).padStart(5)} | ${String(wallMs).padStart(6)} |        - | ERR: ${e.message.substring(0,50)}`, 'err');
    }

    // Yield to browser between trials so UI stays responsive
    await new Promise(r => setTimeout(r, 50));
  }

  const ok = rows.filter(r => r.status === 'ok');
  const wallStats   = stats(ok.map(r => r.wallMs));
  const workerStats = stats(ok.map(r => r.workerMs));

  log('');
  log(`SUCCESS: ${ok.length}/${trials}`, ok.length === trials ? 'ok' : 'err');
  log('');
  log('Wall-clock (outer — includes Worker message-passing overhead):', 'hi');
  log(`  median=${wallStats.median}ms  p95=${wallStats.p95}ms  std=${wallStats.stddev}ms  min=${wallStats.min}ms  max=${wallStats.max}ms`);
  log('Worker-internal (pure snarkjs.groth16.fullProve() time):', 'hi');
  log(`  median=${workerStats.median}ms  p95=${workerStats.p95}ms  std=${workerStats.stddev}ms  min=${workerStats.min}ms  max=${workerStats.max}ms`);

  if (!warmup && ok.length > 0) {
    const result = {
      benchmarkType: 'browser-wasm-groth16',
      generatedAt: new Date().toISOString(),
      browser: navigator.userAgent,
      platform: navigator.platform,
      trials,
      successCount: ok.length,
      proveTimeWall_ms: wallStats,
      proveTimeWorkerInternal_ms: workerStats,
      methodologyNote: [
        'wallMs: performance.now() on main thread, covers full Worker round trip including postMessage serialisation.',
        'workerMs: performance.now() INSIDE the Worker, covers only snarkjs.groth16.fullProve() — comparable to Node.js groth16ProveLocal.',
        'Each trial uses a fresh Worker (created + terminated per proof) to avoid JIT state carryover between trials.',
        'Circuit artifacts prefetched into browser cache before trials; network fetch latency excluded.',
        'Trial 1 may be elevated due to WASM JIT compilation — included in dataset for transparency.',
      ],
      rawTrials: rows,
    };
    lastJson = JSON.stringify(result, null, 2);
    document.getElementById('btnCopy').style.display = 'inline-block';

    const res = document.getElementById('results');
    res.style.display = 'block';
    res.innerHTML = `
<h2>Results — Table I, Browser row</h2>
<table>
  <tr><th>Metric</th><th>Min</th><th>Median</th><th>p95</th><th>Std</th></tr>
  <tr><td>Browser WASM prove (wall, ms)</td><td>${wallStats.min}</td><td><strong>${wallStats.median}</strong></td><td>${wallStats.p95}</td><td>${wallStats.stddev}</td></tr>
  <tr><td>Browser WASM prove (worker-internal, ms)</td><td>${workerStats.min}</td><td><strong>${workerStats.median}</strong></td><td>${workerStats.p95}</td><td>${workerStats.stddev}</td></tr>
</table>
<p class="dim" style="font-size:11px;margin-top:8px">
  <strong>worker-internal</strong> ≈ comparable to Node.js 62ms median.<br>
  <strong>wall</strong> = what the user actually waits for.
</p>`;
  }

  document.getElementById('btnWarm').disabled = false;
  document.getElementById('btnRun').disabled  = false;
}

function copyResults() {
  if (!lastJson) return;
  navigator.clipboard.writeText(lastJson).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON results', 2000);
  });
}
</script>
</body>
</html>
